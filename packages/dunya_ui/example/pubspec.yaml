name: dunya_ui_example
description: Example app for dunya_ui — device test app and pub.dev example.
publish_to: none
version: 0.1.0
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"
dependencies:
  dunya:
    path: ../../dunya
  dunya_ui:
    path: ../
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
# dunya_ui depends on the hosted dunya; use the local copy so the example
# always runs against the code in this repo.
dependency_overrides:
  dunya:
    path: ../../dunya
dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
