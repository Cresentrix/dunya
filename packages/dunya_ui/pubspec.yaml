name: dunya_ui
description: >-
  Flutter country picker: bottom sheet, dialog & dropdown. Material + Cupertino adaptive,
  phone input, 13 locales, A-Z sidebar, favorites, Form support.
version: 1.1.0
homepage: https://github.com/Cresentrix/dunya
repository: https://github.com/Cresentrix/dunya
issue_tracker: https://github.com/Cresentrix/dunya/issues
documentation: https://pub.dev/documentation/dunya_ui/latest/
topics: [country, picker, flag, material, cupertino]
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"
platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:
dependencies:
  cupertino_icons: ^1.0.8
  dunya: ^1.1.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.0
dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
flutter:
  assets:
    - assets/flags/
