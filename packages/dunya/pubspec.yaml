name: dunya
description: >
  Pure-Dart country data & phone validation. 250 countries, ranked search,
  phone number parsing (E.164), favorites, recents, 13-locale translations.
  Powers dunya_ui. Zero Flutter dependency.
version: 1.0.0
homepage: https://github.com/yourname/dunya
repository: https://github.com/yourname/dunya
issue_tracker: https://github.com/yourname/dunya/issues
topics: [country, picker, iso-3166, phone, internationalization]
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"
platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
