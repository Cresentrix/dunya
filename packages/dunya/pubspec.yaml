name: dunya
description: >
  Pure-Dart country data & phone validation. 250 countries, ranked search,
  phone number parsing (E.164), favorites, recents, 13-locale translations.
  Powers dunya_ui. Zero Flutter dependency.
version: 1.0.0
homepage: https://github.com/Ahsan-Solutions/dunya
repository: https://github.com/Ahsan-Solutions/dunya
issue_tracker: https://github.com/Ahsan-Solutions/dunya/issues
documentation: https://pub.dev/documentation/dunya/latest/
topics: [country, picker, iso-3166, phone, internationalization]
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"
dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
